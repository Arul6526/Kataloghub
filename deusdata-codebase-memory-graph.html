"source": 1186, "target": 1183, "type": "CALLS"}, {"source": 1186, "target": 1184, "type": "CALLS"}, {"source": 1186, "target": 1192, "type": "USAGE"}, {"source": 1187, "target": 629, "type": "CALLS"}, {"source": 1187, "target": 630, "type": "CALLS"}, {"source": 1187, "target": 637, "type": "CALLS"}, {"source": 1187, "target": 1186, "type": "CALLS"}];

    document.getElementById('st-rendered').innerText = NODES.length.toLocaleString();

    const COLORS = {
      File: '#38edf8',
      Function: '#34d399',
      Class: '#fbbf24',
      Interface: '#a78bfa',
      Route: '#f87171',
      Project: '#60a5fa',
      Branch: '#f472b6',
      DEFAULT: '#9ca3af'
    };

    // Setup Legend
    const legendEl = document.getElementById('legend');
    Object.keys(COLORS).forEach(k => {
      if (k !== 'DEFAULT') {
        legendEl.innerHTML += `<div class="legend-item"><span class="dot" style="background:${COLORS[k]}"></span>${k}</div>`;
      }
    });

    // Populate Select
    const groupSelect = document.getElementById('group-select');
    const groups = [...new Set(NODES.map(n => n.group))].sort();
    groups.forEach(g => {
      if (g) {
        const opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        groupSelect.appendChild(opt);
      }
    });

    // Initialize layout positions (Circular / Force simulation)
    const nodeMap = new Map();
    const width = window.innerWidth - 340;
    const height = window.innerHeight - 60;

    NODES.forEach((n, i) => {
      const angle = (i / NODES.length) * Math.PI * 2 * 15;
      const radius = 100 + (i % 25) * 25;
      n.x = width / 2 + Math.cos(angle) * radius + (Math.random() - 0.5) * 50;
      n.y = height / 2 + Math.sin(angle) * radius + (Math.random() - 0.5) * 50;
      n.vx = 0;
      n.vy = 0;
      nodeMap.set(n.id, n);
    });

    const edgeList = [];
    EDGES.forEach(e => {
      const src = nodeMap.get(e.source);
      const tgt = nodeMap.get(e.target);
      if (src && tgt) {
        edgeList.push({ source: src, target: tgt, type: e.type });
      }
    });

    // Setup Canvas
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let transform = { x: 0, y: 0, scale: 1 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let selectedNode = null;
    let filteredNodes = NODES;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Physics Step
    function physicsStep() {
      for (let i = 0; i < 3; i++) {
        edgeList.forEach(e => {
          const dx = e.target.x - e.source.x;
          const dy = e.target.y - e.source.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = (dist - 120) * 0.005;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;
          e.source.x += fx;
          e.source.y += fy;
          e.target.x -= fx;
          e.target.y -= fy;
        });
      }
    }
    // Run initial physics iterations
    for(let i=0; i<40; i++) physicsStep();

    function draw() {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);

      // Draw Edges
      ctx.lineWidth = 0.5 / transform.scale;
      ctx.strokeStyle = 'rgba(75, 85, 99, 0.4)';
      edgeList.forEach(e => {
        ctx.beginPath();
        ctx.moveTo(e.source.x, e.source.y);
        ctx.lineTo(e.target.x, e.target.y);
        ctx.stroke();
      });

      // Draw Nodes
      filteredNodes.forEach(n => {
        const color = COLORS[n.group] || COLORS.DEFAULT;
        ctx.beginPath();
        ctx.arc(n.x, n.y, selectedNode === n ? 8 : 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        if (selectedNode === n) {
          ctx.lineWidth = 2 / transform.scale;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        }

        if (transform.scale > 1.2 || selectedNode === n) {
          ctx.font = `${10 / transform.scale}px sans-serif`;
          ctx.fillStyle = '#e5e7eb';
          ctx.fillText(n.name, n.x + 6, n.y + 3);
        }
      });

      ctx.restore();
    }

    draw();

    // Mouse Interaction
    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };

      // Check click on node
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left - transform.x) / transform.scale;
      const my = (e.clientY - rect.top - transform.y) / transform.scale;

      let found = null;
      for (const n of filteredNodes) {
        const dx = n.x - mx;
        const dy = n.y - my;
        if (dx * dx + dy * dy <= 64) {
          found = n;
          break;
        }
      }

      selectedNode = found;
      if (selectedNode) {
        document.getElementById('details').innerHTML = `
          <div class="info-item">
            <div class="lbl">NAMA NODE</div>
            <div class="val">${selectedNode.name}</div>
          </div>
          <div class="info-item">
            <div class="lbl">TIPE ARSITEKTUR</div>
            <div class="val"><span class="badge" style="background:${COLORS[selectedNode.group] || '#4b5563'}">${selectedNode.group}</span></div>
          </div>
          <div class="info-item">
            <div class="lbl">PATH BERKAS</div>
            <div class="val">${selectedNode.filepath || '-'}</div>
          </div>
          <div class="info-item">
            <div class="lbl">BARIS</div>
            <div class="val">${selectedNode.lines || '-'}</div>
          </div>
        `;
      }
      draw();
    });

    canvas.addEventListener('mousemove', e => {
      if (isDragging) {
        transform.x = e.clientX - dragStart.x;
        transform.y = e.clientY - dragStart.y;
        draw();
      }
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      transform.scale *= zoomFactor;
      draw();
    }, { passive: false });

    function resetZoom() {
      transform = { x: canvas.width / 4, y: canvas.height / 4, scale: 0.8 };
      draw();
    }
    resetZoom();

    function onSearch() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      if (!q) {
        filteredNodes = NODES;
      } else {
        filteredNodes = NODES.filter(n => n.name.toLowerCase().includes(q) || n.filepath.toLowerCase().includes(q));
        if (filteredNodes.length > 0) {
          selectedNode = filteredNodes[0];
          transform.x = canvas.width / 2 - selectedNode.x * transform.scale;
          transform.y = canvas.height / 2 - selectedNode.y * transform.scale;
        }
      }
      draw();
    }

    function onGroupFilter() {
      const g = document.getElementById('group-select').value;
      if (g === 'ALL') {
        filteredNodes = NODES;
      } else {
        filteredNodes = NODES.filter(n => n.group === g);
      }
      draw();
    }
